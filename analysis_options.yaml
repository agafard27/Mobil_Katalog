analyzer:
  errors:
    unused_import: error
    unused_local_variable: error
  exclude:
    - .tools/**
    - .pub-cache/**
    - tmp/**
    - build/**
    - android/**
    - ios/**
    - web/**
linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - use_build_context_synchronously
